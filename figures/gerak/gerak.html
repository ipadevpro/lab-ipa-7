<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mobil di lintasan</title></head><body>
<script src="core.js"></script>
<script>
/* Gambar 4 — Mobil di lintasan (Bab 4 Gerak dan Gaya)
   Percobaan nyata (urutan tombol):
   1. Tarik pegas: mobil didorong mundur ke pelontar; batang pendorong ikut masuk, pegas tekan di dalam rumah pelontar
      tertekan x = 3/5/7 cm, lalu pengait (pawl) jatuh ke takik pada batang dan menahannya.
   2. Permukaan: lapisan atas lintasan diganti (kaca / kayu / karpet) -> koefisien gesek efektif berbeda.
   3. Beban: balok baja 200 g dipasang di atas mobil (massa 0,20 -> 0,40 kg).
   4. Lepaskan!: tuas pelepas memutar pengait ke atas, pegas mendorong batang + bantalan dorong, bantalan mendorong
      mobil sampai pegas kembali ke panjang awal (titik 0 mistar). Sejak itu hanya gaya gesek yang bekerja: mobil melambat
      dan berhenti; bila sampai 2,0 m, mobil menumbuk penahan karet, memantul pelan, lalu berhenti.
   Model (angka di stats):
     k = 50 N/m, m = 0,20 kg (+0,20 kg beban). Dorongan pegas: osilasi seperempat periode, c(t) = x cos(wt), w = sqrt(k/m),
     kelajuan lepas v0 = x sqrt(k/m) (gesekan selama dorongan diabaikan).
     Setelah lepas: perlambatan a = mu g, g = 9,8 m/s^2, mu kaca 0,03, kayu 0,06, karpet 0,15.
     s(t) = v0 t - 1/2 a t^2 sampai v = 0 (t = v0/a). Di 2,0 m: tumbukan dengan koefisien restitusi 0,5, lalu melambat lagi.
     Waktu & jarak diukur sejak bagian depan mobil melewati angka 0 mistar (saat lepas dari pegas).
     Jarak = panjang lintasan yang ditempuh; kelajuan rata-rata = jarak / waktu.
   Penyederhanaan gambar (diberi tahu lewat flash): mobil & pelontar digambar ~1,5x lebih besar; dorongan pegas
     diputar 5x lebih lambat; panah gaya pegas digambar 7x lebih pendek dari skala panah gesek.
   Daftar bagian:
     MEJA     papan meja kayu
     LINTASAN papan aluminium 2,9 m, dua bibir pemandu, lapisan permukaan (kaca/kayu/karpet), mistar 0-200 cm di meja
     PELONTAR pelat dudukan, rumah pelontar, batang pendorong + 3 takik, kenop tarik, bantalan dorong, cincin penahan
              (collar), pegas tekan, dua bus pemandu di dinding, pengait (pawl), pin poros pengait, pegas daun, tuas pelepas
     MOBIL    bodi, pelat belakang & bemper depan (karet), lantai sasis, dua poros baja, empat bantalan roda + dudukannya,
              empat roda, baut pemegang beban, balok beban 200 g
     PENAHAN  rangka penahan, bantalan karet, dua sekrup
     PROPS    stopwatch (menampilkan Waktu)  */

/* ---------- model ---------- */
const K_SPR = 50, M_CAR = .20, M_LOAD = .20, G_ACC = 9.8, E_BUMP = .5, SLOWMO = .2, TRACK_M = 2.0;
const SURF = {
  kaca:   { label:'Kaca',   mu:.03, col:'#cfe8ef', note:'Kaca licin: gaya gesek kecil, mobil meluncur jauh' },
  kayu:   { label:'Kayu',   mu:.06, col:'#dcae72', note:'Kayu: gaya gesek sedang' },
  karpet: { label:'Karpet', mu:.15, col:'#b84a3f', note:'Karpet kasar: gaya gesek besar, mobil cepat berhenti' },
};
const massOf = st => M_CAR + (st.load ? M_LOAD : 0);
const accOf = st => SURF[st.surf].mu * G_ACC;
const fmt = (v, d = 2) => (Math.abs(v) < .5 * Math.pow(10, -d) ? 0 : v).toFixed(d).replace('.', ',');

/* ---------- geometry (x = along the track, y = across, z = up; 1 unit = 1 cm) ---------- */
const BRD = [0, 0, 300, 73], BRD_H = 3;                       // table top
const TRK = [2, 10, 296, 36], SZ = 5;                         // track plank (x0, y0, x1, y1), top surface height
const LIP = 1.5, LIP_H = 1.5, YC = 23;
const TRK_TOP = on(PZ(SZ), rectUV(TRK[0], TRK[1], TRK[2], TRK[3]));
const BTOP = boardTop(BRD[0], BRD[1], BRD[2], BRD[3], BRD_H, 5);
// launcher
const HX0 = 15, HX1 = 45, HY0 = 17, HY1 = 29, HZ0 = 5.8, HZ1 = 19, WALL = 1.2;
const RODZ = 11.5, ROD_R = .8, ROD0 = 11, PAD0 = 56, PAD_T = 2, PAD_R = 3.4;
const COL0 = 34, PVX = 40, PVZ = 15.2;                       // collar front at rest, pawl pivot
const NOTCH = [3, 5, 7];
// car (drawn ~1.5x real size)
const CAR_L = 30, BMP = 1.2, CY0 = 15, CY1 = 31, CZ0 = 7.4, CZ1 = 16, WHR = 3.6, AXZ = SZ + WHR;
const CAR_PROF = rrUV(CY0, CZ0, CY1, CZ1, 2.2);
const WHEEL_Y = [[12.4, 14.6], [31.4, 33.6]], AX_OFF = [6.5, 23.5];
const X0 = PAD0 + CAR_L;                                      // ruler zero = car front at launch
const STOP_X = X0 + 200;                                      // rubber face of the stopper (2,0 m)
const RUL = [X0 - 5, 51, X0 + 207, 59], LANE_Y = 41.6, LANE_TY = 47.6;
const SW = [250, 66, 5.6];                                  // stopwatch centre and radius
const H_ALL = 24;

const LNCH = { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' }, YEL = PALS.mustard, RUB = DARK;
const ALU = { l:'#e3e7e8', m:'#b9c0c3', d:'#858e92' }, STEEL = METAL, RULM = matOf('#f2d16b'), BRASS = matOf('#d8b25a');
const swTone = (n, m) => toneI(n, m);
const boxPart = (x0, y0, z0, x1, y1, z1, m, sh = toneI, w = .9) => ({ box:[[x0, y0, z0], [x1, y1, z1]], svg: box(x0, y0, z0, x1, y1, z1, m, sh, w) });

/* flat text lying on a horizontal plane, centred at (x, yc); turned 180 deg when seen from behind so it stays upright */
function txZ(x, yc, z, str, size, col = INK, w = 700){
  let U = Dv(1, 0, 0), V = Dv(0, 1, 0), sg = 1;
  if (U[0] < -1e-3){ U = U.map(v => -v); V = V.map(v => -v); sg = -1; }
  const o = P(x, yc + sg*size*.35, z);
  return `<text transform="${txM(o, U, V)}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${w}" letter-spacing=".02em">${str}</text>`;
}
/* flat arrow on the table from xa (tail) to xb (head) */
function flatArrow(xa, xb, yc, z, col){
  const dir = Math.sign(xb - xa) || 1, len = Math.abs(xb - xa), hl = Math.min(6, len*.6), hw = 3.6, sw = 1.4, xn = xb - dir*hl;
  const pts = [[xa, yc - sw], [xn, yc - sw], [xn, yc - hw], [xb, yc], [xn, yc + hw], [xn, yc + sw], [xa, yc + sw]].map(([x, y]) => [x, y, z]);
  return fill(pd(pts), col) + ink(pd(pts), 1);
}
/* a helical compression spring along x */
function coilX(xa, xb, y, z, r, turns){
  const pts = []; const n = turns*14;
  for (let i = 0; i <= n; i++){ const t = i/n, th = t*turns*2*Math.PI; pts.push([xa + (xb - xa)*t, y + r*Math.sin(th), z + r*Math.cos(th)]); }
  const d = pd(pts, false);
  return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#e4e9ea" stroke-width=".6" stroke-linejoin="round" stroke-linecap="round"/>`;
}
const rotXZ = (a, cx, cz) => ([x, z]) => [cx + x*Math.cos(a) - z*Math.sin(a), cz + x*Math.sin(a) + z*Math.cos(a)];

/* ---------- table, track, ruler, props ---------- */
function surfaceTex(st){
  const key = st.surf, y0 = TRK[1] + LIP, y1 = TRK[3] - LIP, z = SZ + .01;
  const top = on(PZ(z), rectUV(TRK[0], y0, TRK[2], y1));
  let s = fill(pd(top), SURF[key].col);
  if (key === 'kaca'){
    for (let x = 14; x < TRK[2] - 12; x += 34) s += fill(pd([[x, y1, z], [x + 4, y1, z], [x + 14, y0, z], [x + 10, y0, z]]), '#ffffff', 'opacity=".55"');
    for (let x = 30; x < TRK[2]; x += 68) s += fill(pd([[x, y1, z], [x + 1.6, y1, z], [x + 11.6, y0, z], [x + 10, y0, z]]), '#ffffff', 'opacity=".45"');
  } else if (key === 'kayu'){
    let g = '';
    for (const [yy, ph] of [[13.5, 0], [16.8, 1.3], [20.4, 2.1], [24.1, .4], [27.6, 1.8], [31.2, .9]]){
      const pts = []; for (let x = TRK[0]; x <= TRK[2]; x += 6) pts.push([x, yy + .5*Math.sin(x/17 + ph), z]); g += pd(pts, false); }
    s += `<path d="${g}" fill="none" stroke="#a8743f" stroke-width=".5" stroke-linecap="round"/>`;
    for (let x = 60; x < TRK[2]; x += 60) s += line([[x, y0, z], [x, y1, z]], .5);
  } else {
    let dk = '', lt = '';
    for (let x = TRK[0] + 1.5, i = 0; x < TRK[2]; x += 2.6, i++) for (let y = y0 + 1 + (i % 2)*1.3; y < y1; y += 2.6){
      const [X, Y] = P(x, y, z); if ((i + Math.round(y)) % 3) dk += `M${f(X - .5)} ${f(Y)}h1`; else lt += `M${f(X - .5)} ${f(Y)}h1`; }
    s += `<path d="${dk}" stroke="#7f2c24" stroke-width="1.1" stroke-linecap="round"/><path d="${lt}" stroke="#de7a6c" stroke-width="1.1" stroke-linecap="round"/>`;
  }
  return s + ink(pd(top), .7);
}
function trackParts(st, out){
  // plank (aluminium) with the chosen surface layer on top
  out.push({ box:[[TRK[0], TRK[1], BRD_H], [TRK[2], TRK[3], SZ]], svg: box(TRK[0], TRK[1], BRD_H, TRK[2], TRK[3], SZ, ALU, toneI, 1) + surfaceTex(st)
    + hullInk(on(PZ(BRD_H), rectUV(TRK[0], TRK[1], TRK[2], TRK[3])).concat(TRK_TOP), 1.8) });
  for (const [a, b] of [[TRK[1], TRK[1] + LIP], [TRK[3] - LIP, TRK[3]]]) out.push(boxPart(TRK[0], a, SZ, TRK[2], b, SZ + LIP_H, ALU, toneI, .9));
}
function rulerParts(out){
  const [x0, y0, x1, y1] = RUL, zt = BRD_H + .4;
  let s = box(x0, y0, BRD_H, x1, y1, zt, RULM, toneI, .9), tk = '';
  for (let i = 0; i <= 20; i++){ const x = X0 + 10*i; tk += pd([[x, y0, zt + .01], [x, y0 + (i % 5 ? 2 : 3.6), zt + .01]], false); }
  for (let i = 0; i < 200; i += 2){ if (i % 10) { const x = X0 + i; tk += pd([[x, y0, zt + .01], [x, y0 + 1, zt + .01]], false); } }
  s += `<path d="${tk}" fill="none" stroke="${INK}" stroke-width=".55"/>`;
  for (let i = 0; i <= 4; i++) s += txZ(X0 + 50*i, 57, zt + .02, String(50*i), 4.6);
  s += txZ(X0 + 9, 57, zt + .02, 'cm', 3.4);
  out.push({ box:[[x0, y0, BRD_H], [x1, y1, zt]], svg: s });
}
function stopwatchPart(st, out){
  const [x, y, r] = SW, z0 = BRD_H, z1 = BRD_H + 2.6;
  let s = cyl(x, y, z0, z1, r, matOf('#e2483d'), toneI, 1.2, 28);
  s += fill(pd(on(PZ(z1 + .01), ellUV(x, y, r*.82, r*.82, 24))), '#f4efe2') + ink(pd(on(PZ(z1 + .01), ellUV(x, y, r*.82, r*.82, 24))), .6);
  const scr = on(PZ(z1 + .02), rectUV(x - 3.3, y - 1.9, x + 3.3, y + 1.9));
  s += fill(pd(scr), '#1d2a26') + ink(pd(scr), .6) + txZ(x, y, z1 + .03, fmt(st.t, 2), 2.7, '#8af0ae', 800);
  out.push({ box:[[x - r, y - r, z0], [x + r, y + r, z1]], svg: s });
  // crown button + lanyard ring on the far rim
  out.push({ box:[[x - .9, y - r - 2, z0 + .6], [x + .9, y - r + .2, z0 + 2.2]], svg: rod([x, y - r + .2, z0 + 1.4], [x, y - r - 1.6, z0 + 1.4], .8, STEEL, toneI, .8) });
}

/* ---------- launcher ---------- */
function launcherParts(st, out, k){
  const c = st.c, a = .38*st.trig, R = rotXZ(a, PVX, PVZ);
  // base flange screwed to the track
  out.push({ box:[[HX0 - 2, HY0 - 2, SZ], [HX1 + 2, HY1 + 2, HZ0]], svg: box(HX0 - 2, HY0 - 2, SZ, HX1 + 2, HY1 + 2, HZ0, LNCH, toneI, .9)
    + (facing([0,0,1]) ? [[HX0 - 1, HY0 - 1], [HX1 + 1, HY0 - 1], [HX0 - 1, HY1 + 1], [HX1 + 1, HY1 + 1]].map(([x, y]) => { const e = on(PZ(HZ0 + .01), ellUV(x, y, .5, .5, 10)); return fill(pd(e), STEEL.l) + ink(pd(e), .4); }).join('') : '') });
  // housing (closed box with a slot for the lever on top)
  const OUTP = rectUV(HY0, HZ0, HY1, HZ1);
  let body = box(HX0, HY0, HZ0, HX1, HY1, HZ1, LNCH, tone, 1);
  const slot = on(PZ(HZ1 + .01), rectUV(PVX - 4, YC - .8, PVX + 1.5, YC + .8));
  body += fill(pd(slot), '#1d1a16') + ink(pd(slot), .5);
  for (const [xx, nn] of [[HX1, [1,0,0]], [HX0, [-1,0,0]]]) if (facing(nn)){ const h = on(PX(xx + (nn[0] > 0 ? .01 : -.01)), ellUV(YC, RODZ, 1.3, 1.3, 14)); body += fill(pd(h), '#1d1a16') + ink(pd(h), .5); }
  if (facing([0,1,0])) body += `<g>${txYcap('PELONTAR', (HX0 + HX1)/2, HY1 + .01, (HZ0 + HZ1)/2 - 1.2, 3.2)}</g>`;
  body += hullInk([...on(PX(HX0), OUTP), ...on(PX(HX1), OUTP)], 2.2);
  const svg = k > 0 ? xrGhost(body, `<g opacity="${f(k)}">${launcherMech(st)}</g>`, k, OUTP, HX0, HX1, LNCH) : body;
  out.push({ box:[[HX0, HY0, HZ0], [HX1, HY1, HZ1]], svg });
  // outside: rod tail + pull knob behind, rod front + notches + push pad in front
  const tail0 = ROD0 - c;
  out.push({ box:[[tail0 - 3, YC - 1.8, RODZ - 1.8], [HX0, YC + 1.8, RODZ + 1.8]], svg: rod([tail0, YC, RODZ], [HX0, YC, RODZ], ROD_R, STEEL, toneI, .8)
    + rod([tail0 - 3, YC, RODZ], [tail0, YC, RODZ], 1.8, RUB, toneI, 1) });
  const padB = PAD0 - PAD_T - c;
  let fr = rod([HX1, YC, RODZ], [padB, YC, RODZ], ROD_R, STEEL, toneI, .8);
  for (const n of NOTCH){ const nx = 43.5 + n - c; if (nx > HX1 + .4 && nx < padB - .4) fr += notchMark(nx); }
  out.push({ box:[[HX1, YC - 1, RODZ - 1], [padB, YC + 1, RODZ + 1]], svg: fr });
  out.push({ box:[[padB, YC - PAD_R, RODZ - PAD_R], [padB + PAD_T, YC + PAD_R, RODZ + PAD_R]], svg: act('pad', rod([padB, YC, RODZ], [padB + PAD_T, YC, RODZ], PAD_R, RUB, toneI, 1.1, PAD_R, 22)) });
  // release lever above the housing (turns with the pawl)
  const top = R([-1.1, 7.6]), base = R([-.4, 2.6]);
  const tp = [top[0], YC, top[1]], bp = [base[0], YC, base[1]];
  const fz = (HZ1 - bp[2]) / (tp[2] - bp[2]), mid = [bp[0] + (tp[0] - bp[0])*fz, YC, HZ1];
  out.push({ box:[[Math.min(tp[0], mid[0]) - 1.2, YC - 1.2, HZ1], [Math.max(tp[0], mid[0]) + 1.2, YC + 1.2, tp[2] + 1.3]],
    svg: act('lever', rod(mid, tp, .55, STEEL, toneI, .8) + rod(tp, [tp[0], YC, tp[2] + .01], 1.3, matOf('#e2483d'), toneI, 1, 1.3, 14) + ballAt(tp, 1.35, '#e2483d')) });
}
const ballAt = (p, r, col) => { const [X, Y] = P(...p), rr = r*1.22; return `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(rr)}" fill="${col}" stroke="${INK}" stroke-width=".9"/><circle cx="${f(X - rr*.35)}" cy="${f(Y - rr*.35)}" r="${f(rr*.28)}" fill="#fff" opacity=".7"/>`; };
const notchMark = nx => { const q = [[nx - .35, YC - .5, RODZ + ROD_R + .02], [nx + .35, YC - .5, RODZ + ROD_R + .02], [nx + .35, YC + .5, RODZ + ROD_R + .02], [nx - .35, YC + .5, RODZ + ROD_R + .02]];
  return facing([0,0,1]) ? fill(pd(q), '#2b2523') : ''; };
// text on the side plane y = const, read from the +y side
function txYcap(str, x, y, z, size){ return txY(x, y, z, str, size, '#f4f1ea', 800); }

function launcherMech(st){
  const c = st.c, a = .38*st.trig, R = rotXZ(a, PVX, PVZ), parts = [];
  // rod inside + notches
  let r = rod([HX0, YC, RODZ], [HX1, YC, RODZ], ROD_R, STEEL, toneI, .7);
  for (const n of NOTCH){ const nx = 43.5 + n - c; if (nx > HX0 + .4 && nx < HX1 - .4) r += notchMark(nx); }
  parts.push({ box:[[HX0, YC - ROD_R, RODZ - ROD_R], [HX1, YC + ROD_R, RODZ + ROD_R]], svg: r });
  // guide bushes in the two walls
  for (const x of [HX0, HX1 - WALL]) parts.push({ box:[[x, YC - 1.4, RODZ - 1.4], [x + WALL, YC + 1.4, RODZ + 1.4]], svg: rod([x, YC, RODZ], [x + WALL, YC, RODZ], 1.4, BRASS, toneI, .6) });
  // collar fixed on the rod, compression spring from the back wall to the collar
  const cx = COL0 - c;
  parts.push({ box:[[cx, YC - 2.6, RODZ - 2.6], [cx + 1.5, YC + 2.6, RODZ + 2.6]], svg: rod([cx, YC, RODZ], [cx + 1.5, YC, RODZ], 2.6, BRASS, toneI, .8) });
  parts.push({ box:[[HX0 + WALL, YC - 2.3, RODZ - 2.3], [cx, YC + 2.3, RODZ + 2.3]], svg: coilX(HX0 + WALL + .1, cx - .1, YC, RODZ, 2.2, 8) });
  // pawl (latch) on its pivot pin: its tip sits in the notch on top of the rod
  const PAWL = [[-1.2, 1.1], [1.2, .9], [4.0, -2.2], [3.5, -2.9], [2.6, -2.4], [-1.2, -1.1]].map(R);
  const pw = y => PAWL.map(([x, z]) => [x, y, z]);
  const A = pw(YC - 1), B = pw(YC + 1), cap = facing([0,1,0]) ? B : A;
  parts.push({ box:[[PVX - 1.6, YC - 1, Math.min(...PAWL.map(p => p[1]))], [Math.max(...PAWL.map(p => p[0])), YC + 1, PVZ + 1.4]],
    svg: loft(A, B, n => toneI(n, matOf('#f2c230'))) + shape(cap, '#f2c230', .7) + hullInk([...A, ...B], 1) });
  parts.push({ box:[[PVX - .5, HY0, PVZ - .5], [PVX + .5, HY1, PVZ + .5]], svg: rod([PVX, HY0, PVZ], [PVX, HY1, PVZ], .5, STEEL, toneI, .6) });
  // leaf spring from a screw under the housing top, pressing the pawl down
  const lp = R([1.5, .9]);
  parts.push({ box:[[lp[0] - .3, YC - .6, lp[1]], [44, YC + .6, HZ1]], svg: line([[44, YC, HZ1 - WALL], [43, YC, HZ1 - WALL - .2], [lp[0], YC, lp[1] + .2]], 1.6)
    + `<path d="${pd([[44, YC, HZ1 - WALL], [43, YC, HZ1 - WALL - .2], [lp[0], YC, lp[1] + .2]], false)}" fill="none" stroke="#cfd6d8" stroke-width=".6"/>` + rod([44, YC, HZ1 - WALL], [44, YC, HZ1 - WALL - .6], .6, STEEL, toneI, .5) });
  // lever stem inside the housing, from the pawl up to the slot
  const t0 = R([-.4, 1]), t1 = R([-.7, 4.4]);
  parts.push({ box:[[Math.min(t0[0], t1[0]) - .6, YC - .6, t0[1]], [Math.max(t0[0], t1[0]) + .6, YC + .6, HZ1]], svg: rod([t0[0], YC, t0[1]], [t1[0], YC, t1[1]], .55, STEEL, toneI, .7) });
  return byDepth(parts);
}

/* ---------- car ---------- */
function carParts(st, m, out, k){
  const r0 = PAD0 - st.c + st.s*100 - 0;            // rear of the car (on the pad when at the launcher)
  const rear = r0, bx0 = rear + BMP, bx1 = rear + CAR_L - BMP;
  // body: rounded profile swept along x
  let body = extrude(CAR_PROF, bx0, bx1, m);
  for (const [xx, nn] of [[bx1, [1,0,0]], [bx0, [-1,0,0]]]) if (facing(nn)){ const cp = on(PX(xx), CAR_PROF); body += fill(pd(cp), tone(nn, m)) + ink(pd(cp), 1); }
  // white stripe + number on each side
  for (const [yy, nn] of [[CY1 + .01, [0,1,0]], [CY0 - .01, [0,-1,0]]]) if (facing(nn)){
    const q = on(PY(yy), rectUV(bx0 + 1.5, 12.2, bx1 - 1.5, 13.4)); body += fill(pd(q), '#fff4d6') + ink(pd(q), .5); }
  if (facing([0,0,1])){ const q = on(PZ(CZ1 + .01), rectUV(bx0 + 3, CY0 + 3, bx1 - 3, CY1 - 3)); body += ink(pd(q), .6); }
  body += hullInk([...on(PX(bx0), CAR_PROF), ...on(PX(bx1), CAR_PROF)], 2.4);
  const svg = k > 0 ? xrGhost(body, `<g opacity="${f(k)}">${carMech(st, rear)}</g>`, k, CAR_PROF, bx0, bx1, m) : body;
  out.push({ box:[[bx0, CY0, CZ0], [bx1, CY1, CZ1]], svg: act('car', svg) });
  // rear plate (hit by the push pad) and front rubber bumper
  out.push(boxPart(rear, 18, 9, bx0, 28, 14, RUB, toneI, .8));
  out.push(boxPart(bx1, 17, 8.6, rear + CAR_L, 29, 12.6, RUB, toneI, .8));
  // wheels: tyre + hub with three holes that turn as the car rolls
  const th = -(st.roll || 0) / WHR;
  for (const ax of AX_OFF) for (const [ya, yb] of WHEEL_Y){
    const x = rear + ax, out1 = facing([0, ya < YC ? -1 : 1, 0]), capY = facing([0,1,0]) ? yb : ya;
    let w = rod([x, ya, AXZ], [x, yb, AXZ], WHR, RUB, toneI, 1.1, WHR, 26);
    const hub = on(PY(capY + (capY === yb ? .02 : -.02)), ellUV(x, AXZ, 1.9, 1.9, 18));
    w += fill(pd(hub), '#d6dadb') + ink(pd(hub), .6);
    for (let i = 0; i < 3; i++){ const aa = th + i*2*Math.PI/3, hc = on(PY(capY + (capY === yb ? .03 : -.03)), ellUV(x + 1.1*Math.cos(aa), AXZ + 1.1*Math.sin(aa), .38, .38, 8)); w += fill(pd(hc), '#3a3632'); }
    // axle stub between wheel and body
    const ys = ya < YC ? [yb, CY0] : [CY1, ya];
    w = (out1 ? rod([x, ys[0], AXZ], [x, ys[1], AXZ], .5, STEEL, toneI, .5) + w : w + rod([x, ys[0], AXZ], [x, ys[1], AXZ], .5, STEEL, toneI, .5));
    out.push({ box:[[x - WHR, Math.min(ya, ys[0], ys[1]), SZ], [x + WHR, Math.max(yb, ys[0], ys[1]), AXZ + WHR]], svg: w });
  }
  // 200 g steel block on top
  if (st.load){ const cx = rear + CAR_L/2;
    let s = box(cx - 4, 20, CZ1, cx + 4, 26, CZ1 + 2, STEEL, toneI, 1);
    if (facing([0,0,1])) s += txZ(cx, YC, CZ1 + 2.02, '200 g', 2.4);
    out.push({ box:[[cx - 4, 20, CZ1], [cx + 4, 26, CZ1 + 2]], svg: s }); }
  return rear;
}
function carMech(st, rear){
  const parts = [], bx0 = rear + BMP, bx1 = rear + CAR_L - BMP;
  parts.push(boxPart(bx0 + .8, CY0 + 1, CZ0 + .1, bx1 - .8, CY1 - 1, CZ0 + .7, matOf('#9aa3a7'), toneI, .7));
  for (const ax of AX_OFF){ const x = rear + ax;
    parts.push({ box:[[x - .5, CY0, AXZ - .5], [x + .5, CY1, AXZ + .5]], svg: rod([x, CY0, AXZ], [x, CY1, AXZ], .5, STEEL, toneI, .6) });
    for (const [ya, yb] of [[CY0 + .2, CY0 + 2.2], [CY1 - 2.2, CY1 - .2]]){
      parts.push(boxPart(x - 1.8, ya, CZ0 + .7, x + 1.8, yb, AXZ - 1.5, matOf('#7c8389'), toneI, .6));          // bearing seat
      const capY = facing([0,1,0]) ? yb : ya, ring = on(PY(capY + (capY === yb ? .02 : -.02)), ellUV(x, AXZ, .95, .95, 14));
      parts.push({ box:[[x - 1.6, ya, AXZ - 1.6], [x + 1.6, yb, AXZ + 1.6]], svg: rod([x, ya, AXZ], [x, yb, AXZ], 1.6, BRASS, toneI, .7, 1.6, 18) + fill(pd(ring), '#8a7a4a') + ink(pd(ring), .4) });
    }
  }
  // threaded post that holds the load block
  const cx = rear + CAR_L/2;
  parts.push({ box:[[cx - .5, YC - .5, CZ0 + .7], [cx + .5, YC + .5, CZ1]], svg: rod([cx, YC, CZ0 + .7], [cx, YC, CZ1], .5, STEEL, toneI, .6) });
  return byDepth(parts);
}

/* ---------- stopper ---------- */
function stopperParts(out){
  out.push(boxPart(STOP_X, 16, 8, STOP_X + 2.5, 30, 15, RUB, toneI, 1));
  let s = box(STOP_X + 2.5, TRK[1] + LIP, SZ, STOP_X + 8, TRK[3] - LIP, 17, YEL, tone, 1);
  if (facing([0,0,1])) for (const y of [16, 30]){ const e = on(PZ(17.01), ellUV(STOP_X + 5.2, y, .7, .7, 10)); s += fill(pd(e), STEEL.l) + ink(pd(e), .5); }
  out.push({ box:[[STOP_X + 2.5, TRK[1] + LIP, SZ], [STOP_X + 8, TRK[3] - LIP, 17]], svg: s });
}

/* ---------- force arrows (flat, in a lane on the table beside the track) ---------- */
const F_SCALE = 150, F_SCALE_SPR = 20;                         // cm of arrow per newton (spring arrow drawn 7x shorter)
function arrowParts(st, out){
  const xc = PAD0 - st.c + st.s*100 + CAR_L/2, z = BRD_H + .05;
  const items = [];
  if (st.phase === 'push' && st.c > .05){ const F = K_SPR*st.c/100; items.push([xc, xc + F*F_SCALE_SPR, '#3f7fc0', 'GAYA PEGAS']); }
  if ((st.phase === 'run' || st.phase === 'pose') && st.v > 1e-4){ const F = SURF[st.surf].mu*massOf(st)*G_ACC; const len = F*F_SCALE, back = xc - st.dir*len;   // drawn behind the car; if it would leave the table, ahead of it pointing back at it
    items.push(back > 4 && back < BRD[2] - 4 ? [xc, back, '#e2483d', 'GAYA GESEK'] : [xc + st.dir*len, xc, '#e2483d', 'GAYA GESEK']); }
  for (const [a, b, col, txt] of items){
    const s = flatArrow(a, b, LANE_Y, z, col) + txZ((a + b)/2, LANE_TY, z, txt, 4.4, col === '#e2483d' ? '#a3271e' : '#1f4f86', 800);
    out.push({ box:[[Math.min(a, b) - 1, LANE_Y - 4, BRD_H], [Math.max(a, b) + 1, LANE_TY + 2, z]], svg: s });
  }
}

/* ---------- scene ---------- */
function carShadowPts(rear){ const pts = [];
  for (const x of [rear, rear + CAR_L]) for (const y of [12.4, 33.6]) for (const z of [SZ, CZ1 + 1]) pts.push([x, y, z]); return pts; }
function scene(st, m){
  const k = ease(st.xr || 0), rear = PAD0 - st.c + st.s*100;
  let s = board(BRD[0], BRD[1], BRD[2], BRD[3], BRD_H, 5, WOOD);
  s += clipTo(BTOP, castShadow([...on(PZ(BRD_H), rectUV(TRK[0], TRK[1], TRK[2], TRK[3])), ...on(PZ(SZ + LIP_H), rectUV(TRK[0], TRK[1], TRK[2], TRK[3]))], BRD_H)
    + castShadow([...on(PZ(BRD_H), ellUV(SW[0], SW[1], SW[2], SW[2], 16)), ...on(PZ(BRD_H + 2.6), ellUV(SW[0], SW[1], SW[2], SW[2], 16))], BRD_H));
  // lower layer: things on the table
  const low = []; trackParts(st, low); rulerParts(low); stopwatchPart(st, low); arrowParts(st, low);
  s += byDepth(low);
  // shadows on the track top
  s += clipTo(TRK_TOP, castShadow(carShadowPts(rear), SZ)
    + castShadow([...on(PZ(SZ), rectUV(HX0 - 2, HY0 - 2, HX1 + 2, HY1 + 2)), ...on(PZ(HZ1), rectUV(HX0, HY0, HX1, HY1))], SZ)
    + castShadow([...on(PZ(SZ), rectUV(STOP_X, TRK[1] + LIP, STOP_X + 8, TRK[3] - LIP)), ...on(PZ(17), rectUV(STOP_X, TRK[1] + LIP, STOP_X + 8, TRK[3] - LIP))], SZ));
  // upper layer: lips, launcher, car, stopper
  const up = [];
  for (const [a, b] of [[TRK[1], TRK[1] + LIP], [TRK[3] - LIP, TRK[3]]]) up.push(boxPart(TRK[0], a, SZ, TRK[2], b, SZ + LIP_H, ALU, toneI, .9));
  launcherParts(st, up, k); carParts(st, m, up, k); stopperParts(up);
  s += byDepth(up);
  s += labels(st, k, rear);
  return s;
}
function labels(st, k, rear){
  // pills placed relative to the track as seen now: u = along the track on screen, n = across it (pointing up the screen)
  const d = Dv(1, 0, 0), l = Math.hypot(...d) || 1, u = [d[0]/l, d[1]/l]; let n = [-u[1], u[0]]; if (n[1] > 0) n = [-n[0], -n[1]];
  const vb = document.getElementById('fig').viewBox.baseVal, K = INK_K;
  const T = (p, side, dist, along, text, on) => { const [X, Y] = P(...p), off = sd => [n[0]*sd*dist + u[0]*along, n[1]*sd*dist + u[1]*along];
    let [dx, dy] = off(side); const yy = Y + dy*K, hw = (text.length*.62 + 1.5)*8.6*K/2;
    if (yy < vb.y + 14*K || yy > vb.y + vb.height - 14*K) [dx, dy] = off(-side);              // no room on that side: flip
    const xx = Math.max(vb.x + hw + 2*K, Math.min(vb.x + vb.width - hw - 2*K, X + dx*K)); dx = (xx - X)/K;
    return tag(p, dx, dy, text, on); };
  const moving = st.phase === 'run' || st.phase === 'push', xr = k > .6;
  let s = T([rear + CAR_L/2, YC, CZ1], 1, 34, xr ? 4 : 0, 'MOBIL', moving)
    + T([rear + AX_OFF[1], 33.6, AXZ], -1, 30, xr ? 46 : 18, 'RODA', moving)
    + T([X0 + 120, 55, BRD_H + .4], -1, 22, 0, 'MISTAR', false)
    + T([STOP_X + 5, YC, 17], 1, 30, 0, 'PENAHAN', !!st.bumped && st.phase === 'stop');
  if (xr){
    s += T([26, YC + 2.2, RODZ + 2.2], -1, 34, -46, 'PEGAS', ['push', 'load', 'ready'].includes(st.phase))
      + T([PVX + 2.6, YC, PVZ - 1.6], 1, 40, -40, 'PENGAIT', st.phase === 'ready' || st.phase === 'fire')
      + T([PVX - 1.5, YC, HZ1 + 4], 1, 26, -88, 'TUAS', st.phase === 'fire')
      + T([rear + AX_OFF[0], CY1 - 1, AXZ], -1, 34, -4, 'POROS', moving)
      + T([rear + AX_OFF[1], CY1 - 1.2, AXZ + 1.2], 1, 38, 62, 'BANTALAN RODA', moving);
  }
  return s;
}

/* ---------- behaviour ---------- */
let ui, simOn = false, runId = 0;
const MOVING = ['back', 'load', 'fire', 'push', 'run'];
const busy = st => MOVING.includes(st.phase);
function stepSim(st, dt){
  if (st.phase === 'back'){                              // the car is pushed back by hand to the launcher
    const d = Math.min(Math.abs(st.s), 1.4*dt), sg = st.s > 0 ? -1 : 1;
    st.s += sg*d; st.roll += sg*d*100;
    if (Math.abs(st.s) < 1e-6){ st.s = 0; st.phase = 'load'; }
    return true;
  }
  if (st.phase === 'load'){                              // the car pushes the pad in until the pawl drops into the notch
    const goal = st.pull, rate = 9*dt, prev = st.c;
    st.c = st.c < goal ? Math.min(goal, st.c + rate) : Math.max(goal, st.c - rate);
    st.roll -= (st.c - prev);
    if (st.c === goal){ st.phase = 'ready'; st.trig = 0; ui.flash(`Pengait menahan pegas yang tertekan ${goal} cm`, 2200); return false; }
    return true;
  }
  if (st.phase === 'fire'){ st.trig = Math.min(1, st.trig + dt/.15); if (st.trig >= 1){ st.phase = 'push'; st.tau = 0; } return true; }
  if (st.phase === 'push'){
    st.tau += dt*SLOWMO;
    const w = Math.sqrt(K_SPR/massOf(st)), ph = Math.min(Math.PI/2, w*st.tau), prev = st.c;
    st.c = st.X*Math.cos(ph); st.roll += prev - st.c;
    st.v = st.X/100*w*Math.sin(ph); st.dir = 1;
    if (ph >= Math.PI/2){
      st.c = 0; st.s = 0; st.v0 = st.X/100*w; st.v = st.v0; st.phase = 'run'; st.t = 0; st.dist = 0;
      st.seg = { s0:0, u:st.v0, dir:1, tau:0 };
      if (st.runs > 1) ui.flash(`Pegas mendorong mobil: kelajuan awal ${fmt(st.v0)} m/s`, 1800);
    }
    return true;
  }
  if (st.phase === 'run'){
    st.trig = Math.max(0, st.trig - dt/.4);
    const a = accOf(st); let rem = dt, guard = 0;
    while (rem > 1e-9 && st.phase === 'run' && guard++ < 6){
      const sg = st.seg, tStop = sg.u / a; let h = Math.min(rem, tStop - sg.tau), bump = false;
      if (sg.dir > 0){ const T = sg.tau + h, pos = sg.s0 + sg.u*T - .5*a*T*T;
        if (pos >= TRACK_M){ const D = sg.u*sg.u - 2*a*(TRACK_M - sg.s0); h = Math.max(0, (sg.u - Math.sqrt(Math.max(0, D)))/a - sg.tau); bump = true; } }
      sg.tau += h; rem -= h; st.t += h;
      const pos = sg.s0 + sg.dir*(sg.u*sg.tau - .5*a*sg.tau*sg.tau);
      st.dist += Math.abs(pos - st.s); st.roll += (pos - st.s)*100; st.s = pos; st.v = Math.max(0, sg.u - a*sg.tau); st.dir = sg.dir;
      if (bump){ st.s = TRACK_M; st.seg = { s0:TRACK_M, u:E_BUMP*st.v, dir:-1, tau:0 }; st.bumped = true;
        ui.flash('Mobil menumbuk penahan karet, memantul pelan, lalu berhenti', 2000); continue; }
      if (sg.tau >= tStop - 1e-9){ st.v = 0; st.phase = 'stop'; onStop(st); }
    }
    return st.phase === 'run' || st.trig > 0;
  }
  st.trig = Math.max(0, st.trig - dt/.4);
  return st.trig > 0;
}
function runLoop(){
  if (simOn) return; simOn = true;
  ui.animate(dt => { const go = stepSim(ui.st, dt); if (!go) simOn = false; return go; });
}
function onStop(st){
  st.avg = st.t > 0 ? st.dist / st.t : 0;
  const id = ++runId, msg = `Kelajuan rata-rata = jarak / waktu = ${fmt(st.dist)} m / ${fmt(st.t)} s = ${fmt(st.avg)} m/s`;
  setTimeout(() => { if (id !== runId) return; ui.flash(msg, 4200);
    setTimeout(() => { if (id !== runId) return; ui.flash('Gesekan menghentikan mobil; tanpa gesekan ia terus bergerak (Hukum I)', 3600); }, 4400); }, st.bumped ? 1200 : 150);
}
function resetRun(st){ st.t = 0; st.dist = 0; st.v = 0; st.avg = null; st.bumped = false; runId++; }
function pullTo(st, cm){
  if (busy(st)) return ui.flash('Tunggu mobil berhenti dulu');
  st.pull = cm; resetRun(st);
  st.phase = Math.abs(st.s) > 1e-6 ? 'back' : 'load';
  runLoop();
}
function release(st){
  if (busy(st)) return ui.flash('Tunggu mobil berhenti dulu');
  if (st.phase !== 'ready') return ui.flash('Tarik pegas dulu: pilih 3 cm, 5 cm, atau 7 cm');
  st.X = st.c; st.runs = (st.runs || 0) + 1; st.phase = 'fire'; resetRun(st);
  if (st.runs === 1) ui.flash('Ilustrasi: mobil diperbesar; dorongan pegas diperlambat 5×, panahnya diperkecil', 2600);
  runLoop();
}
function setSurf(st, key){
  if (busy(st)) return ui.flash('Tunggu mobil berhenti dulu');
  st.surf = key; ui.flash(SURF[key].note, 2400);
}
function setLoad(st, on){
  if (busy(st)) return ui.flash('Tunggu mobil berhenti dulu');
  st.load = on;
  ui.flash(on ? 'Massa 0,40 kg: lebih sulit dipercepat (Hukum II Newton, a = F/m)' : 'Massa 0,20 kg: lebih mudah dipercepat (a = F/m)', 2600);
}

ui = mountFigure({
  fig:'4', turn:'full', title:'Mobil di lintasan',
  size:[BRD[2], BRD[3], H_ALL], palette:'tomato', credit:false,
  // phase: idle | back | load | ready | fire | push | run | stop | pose.  c = spring compression (cm), s = car front past the 0 mark (m)
  state:{ phase:'idle', surf:'kayu', load:false, pull:5, c:0, s:0, v:0, dir:1, t:0, dist:0, avg:null, roll:0, trig:0, X:0, tau:0, runs:0, bumped:false },
  scene,
  readout: st => st.avg != null ? `kelajuan rata-rata ${fmt(st.avg)} m/s` : '',
  stats: st => [
    { label:'Waktu', value: fmt(st.t) + ' s' },
    { label:'Jarak', value: fmt(st.dist) + ' m' },
    st.avg != null ? { label:'Rata-rata', value: fmt(st.avg) + ' m/s', small:true } : { label:'Kelajuan', value: fmt(st.v) + ' m/s', small:true } ],
  buttons:[
    { label:'Tarik pegas', choices: st => NOTCH.map(cm => ({ label:`${cm} cm`, current: st.phase === 'ready' && st.pull === cm, disabled: busy(st), why:'Tunggu mobil berhenti dulu', onClick: st => pullTo(st, cm) })) },
    { label:'Permukaan', choices: st => Object.keys(SURF).map(key => ({ label: SURF[key].label, current: st.surf === key, disabled: busy(st), why:'Tunggu mobil berhenti dulu', onClick: st => setSurf(st, key) })) },
    { label:'Beban', choices: st => [[false, 'Tanpa beban'], [true, '+200 g']].map(([on, label]) => ({ label, current: st.load === on, disabled: busy(st), why:'Tunggu mobil berhenti dulu', onClick: st => setLoad(st, on) })) },
    { label:'Lepaskan!', onClick: st => release(st) },
  ],
  acts:{ lever: st => release(st), pad: st => { if (!busy(st) && st.phase !== 'ready') pullTo(st, st.pull); } },
  params:(st, q) => {
    if (SURF[q.get('surf')]) st.surf = q.get('surf');
    if (q.get('load') === '1') st.load = true;
    if (q.has('pull')){ const cm = +q.get('pull'); if (NOTCH.includes(cm)){ st.pull = cm; st.c = cm; st.phase = 'ready'; } }
    if (q.has('s')){ st.s = Math.max(0, Math.min(TRACK_M, +q.get('s') || 0)); st.c = 0; st.phase = 'stop'; st.roll = st.s*100;
      if (q.has('v')){ st.v = Math.max(0, +q.get('v') || 0); st.dir = q.get('dir') === '-1' ? -1 : 1; st.phase = 'pose'; } }
    if (q.has('push')){ const cm = NOTCH.includes(+q.get('push')) ? +q.get('push') : 5; st.X = cm; st.c = cm*.6; st.phase = 'push'; st.trig = 1; st.frozen = true; }
  },
});
xrMount(() => ui, () => '');
</script></body></html>
